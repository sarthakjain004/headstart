# Settle, from the vantage production actually uses, whether the new User-Agent clears the
# SuccessFactors edge policy.
#
# `docs/successfactors/2026-09-07_user-agent-denylist.md` reproduced the 403 from a laptop and
# bisected it to one exact literal — `headstart/0.1 (job-board reader)` refused, `(job-board)`,
# `(reader)`, `curl/8.7.1` and `python-requests/2.32.3` all served. That diagnosis needs no runner.
# What it cannot answer is whether the policy is **also** keyed on the source address, because
# every one of those samples came from one laptop IP. Production runs from Actions, so a fix
# verified only from a laptop is a fix verified from the wrong place.
#
# That matters here more than usual: the first theory of this bug WAS an egress wall, and it was
# discarded because the string alone explained the laptop's results. If the policy scores address
# and User-Agent together, the string fix could clear a laptop and still refuse a runner, and the
# symptom — 0 jobs, silently, on 102 Boards — is one nothing alerts on.
#
# Manual only. This is a diagnostic, not a guard: it fetches a few dozen job pages from three
# tenants, which is a rounding error against one production pass over the same Boards, but it is
# not something to leave on a schedule.
#
# Two arms, because "does it work from here" and "does it work from a *different* here" are
# different questions. `direct` is the route production takes for SuccessFactors, which sets no
# `egress_fallback_on` (only eightfold, workday and workable do) and therefore has no second
# address. `warp` repeats it through the spare egress (ADR-0063) — if direct refuses and warp
# serves, the policy is address-keyed after all and opting this ATS in becomes the real fix.
name: probe-successfactors-ua

on:
  workflow_dispatch:
    inputs:
      n:
        description: job pages fetched per board per arm
        default: "12"
      arms:
        description: "comma-separated subset of: direct,warp"
        default: "direct,warp"
      suspects:
        description: Boards the old literal was refused on (comma-separated hosts)
        default: careers.te.com,jobs.l3harris.com
      controls:
        description: A Board that served fine throughout — without it a failure proves nothing
        default: careers.bureauveritas.com

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # hang detector; the fetches themselves are seconds
    strategy:
      fail-fast: false # one replica's bad luck must not cancel the other sample
      matrix:
        # Two replicas because one runner is one egress IP, and the whole residual question is
        # whether the verdict is a property of the address. A single sample cannot tell "runners
        # are served" from "this runner was served".
        replica: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[scrape]"
      - name: Install Cloudflare WARP (spare egress, ADR-0063)
        # The executable half of pipeline.yml's step of the same name, condensed the same way
        # probe-workday-400.yml condenses it. Same contract: never fatal. On a runner without it
        # `spare_egress.proxy_url()` returns None and the `warp` arm reports itself skipped rather
        # than failing the probe, so the `direct` arm — the one that answers the actual question —
        # still lands.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -x
          stub_gui_deps() {
            sudo DEBIAN_FRONTEND=noninteractive timeout 60 apt-get install -y -qq \
              -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=2 \
              equivs || return 1
            local d
            d=$(mktemp -d)
            for p in libwebkit2gtk-4.1-0 libayatana-appindicator3-1; do
              printf 'Section: misc\nPriority: optional\nStandards-Version: 3.9.2\nPackage: %s-headless-stub\nProvides: %s\nDescription: stub for headless warp-svc\n A no-op package satisfying a GUI dependency warp-svc never calls.\n' \
                "$p" "$p" > "$d/$p.ctl"
              (cd "$d" && equivs-build "$p.ctl" >/dev/null) || return 1
            done
            sudo dpkg -i "$d"/*headless-stub*.deb >/dev/null || return 1
          }
          if ! stub_gui_deps; then
            echo "warp: GUI dependency stubs unavailable — full install" >&2
            sudo timeout 20 dpkg --configure -a >/dev/null 2>&1 || true
          fi
          install_warp() {
            curl -fsSL --max-time 15 --retry 1 --retry-delay 2 \
              https://pkg.cloudflareclient.com/pubkey.gpg \
              | sudo gpg --yes --dearmor \
                -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg || return 1
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo timeout 45 apt-get update -qq \
              -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
              -o Acquire::Retries=2 \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/cloudflare-client.list \
              -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 || true
            sudo timeout 60 apt-get install -y -qq \
              -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
              -o Acquire::Retries=2 cloudflare-warp || return 1
          }
          if ! install_warp; then
            echo "warp install attempt 1 failed — retrying" >&2
            sleep 20
            install_warp || echo "warp install attempt 2 failed — degrading to direct" >&2
          fi
          sudo timeout 15 systemctl start warp-svc || true
          for _ in $(seq 1 15); do
            timeout 5 warp-cli --accept-tos status >/dev/null 2>&1 && break
            sleep 1
          done
          timeout 30 warp-cli --accept-tos registration new || true
          timeout 15 warp-cli --accept-tos status || true
      - name: Probe
        # Inputs arrive through `env:` rather than being interpolated into the script. `${{ }}` is
        # substituted into the shell source before bash sees it, so a value carrying shell
        # metacharacters would run as code; an env var is only ever data. Dispatch inputs come from
        # someone with write access, so this is hygiene rather than a live hole — but it costs one
        # line, and the alternative reads as though the question was never asked.
        env:
          N: ${{ github.event.inputs.n }}
          ARMS: ${{ github.event.inputs.arms }}
          SUSPECTS: ${{ github.event.inputs.suspects }}
          CONTROLS: ${{ github.event.inputs.controls }}
        run: |
          # OUT first, before anything that can fail: the upload step globs `$OUT.*`, and an unset
          # OUT would make that `.*` — every dotfile in the workspace, uploaded in place of the
          # result nobody would notice was missing.
          out="probe-successfactors-ua_${{ github.run_id }}_replica-${{ matrix.replica }}"
          echo "OUT=$out" >> "$GITHUB_ENV"
          python -u scripts/bench/probe_successfactors_detail.py \
            --n "$N" \
            --arms "$ARMS" \
            --suspects "$SUSPECTS" \
            --controls "$CONTROLS" \
            --out "$out.json" 2>&1 | tee "$out.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-successfactors-ua-replica-${{ matrix.replica }}
          path: ${{ env.OUT }}.*
          retention-days: 30

name: email-alerts

# Sends one Digest per Subscription after each successful pipeline run (ADR-0035).
# Inert (green no-op) until the secrets below are set — see docs/email-alerts.md.
#
# Triggered by the pipeline finishing rather than on its own schedule: a Digest describes
# what one run added, so running on a clock would either duplicate a window or miss one.
# Deliberately a separate workflow, not a pipeline stage — email delivery must not share a
# failure domain with ingest in either direction.
on:
  workflow_run:
    workflows: ["nightly-pipeline"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: email-alerts # never let two runs race on the Subscription records
  cancel-in-progress: false

jobs:
  digest:
    # A failed pipeline publishes nothing new, so there is nothing to mail; sending anyway
    # would describe an index state that never shipped. workflow_dispatch has no parent run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tags are mutable — cf. tj-actions
      # CVE-2025-30066). Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[alerts]"
      - name: Send the digests (skips cleanly until secrets are set)
        env:
          SUBSCRIBERS_REPO: ${{ vars.SUBSCRIBERS_REPO }}
          SUBSCRIBERS_TOKEN: ${{ secrets.SUBSCRIBERS_TOKEN }}
          # The wall gates /search, and this run has no Google identity to offer, so it
          # carries the shared secret the Space also holds (docs/email-alerts.md). Must
          # match the Space's ALERTS_TOKEN exactly or every Digest 401s.
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_SENDER: ${{ vars.ALERTS_SENDER }}
          # Each transport is optional: whichever secrets are set is what gets delivered,
          # and Subscriptions on an unconfigured one are skipped rather than failing the
          # run (ADR-0038).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: python -u -m headstart.alerts.run

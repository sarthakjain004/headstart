name: cleanup-index

# Index cleanup (ADR-0023): download the served LanceDB index, prune stale and duplicate rows,
# rebuild it fresh to reclaim orphan fragments, re-upload the compacted index, and restart the
# Space. Runs on Actions (roomy disk, the HF_TOKEN secret, fast network) — never locally.
#
# Now also the pipeline's periodic compaction. `index compact` used to run on EVERY pipeline run,
# which rebuilt the table into one new .lance file each time — a brand-new ~755 MB blob that HF
# stores in full and retains forever, filling the 100 GB quota in ~45 runs. Between compactions
# Lance simply appends: `sync`/`prune` write small new fragments and leave the existing file alone,
# so a run uploads ~10% of the table instead of all of it.
#
# Daily, not weekly: Lance's own guidance is to optimize after ~20 data-modification operations,
# and the pipeline does several per run. Fragments accumulating between compactions is the
# deliberate trade — more files to open per query, reclaimed here. It also compacts the ADR-0050
# description store, whose per-run fragments accumulate on the same principle.
#
# Was every 2 days. Daily doubles the ~755 MB rebuild's blob churn, which the daily history squash
# still bounds to a week (~5.3 GB against a 100 GB quota). The real cost is contention: this job
# shares the pipeline's concurrency group and can run 90 minutes, so a pipeline run queues behind
# it once more per two days.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC. The hour is not load-bearing — this run can no longer be
    # displaced by anything (see `concurrency` below), so it does not need a quiet slot. It waits
    # out whatever pipeline is mid-flight, and re-dispatches itself if that takes too long
  workflow_dispatch:
    inputs:
      attempt:
        description: "Retry counter — set by this workflow re-dispatching itself. Leave blank."
        required: false
        default: "1"

permissions:
  contents: read
  actions: write # read: is a pipeline in flight; write: re-dispatch this workflow when one is

concurrency:
  # Its OWN group, not the pipeline's. Sharing one looked like mutual exclusion and behaved like
  # starvation: GitHub keeps a single *pending* run per group and a newer arrival replaces it, so
  # an hourly pipeline (80-130 min per run) nearly always had a fresher run waiting and this
  # once-a-day job was the one displaced. It last succeeded 2026-08-24, was cancelled on the 25th
  # and 26th, and by the 27th `_deletions/` had passed HF's 10,000-files-per-directory limit and
  # every pipeline upload was rejected.
  #
  # Exclusion is now the other way round and is enforced by both sides: this job waits for any
  # in-flight pipeline before it touches anything, and the pipeline's own gate stands down while
  # this is running or queued. The pipeline is hourly and idempotent, so it is the one that can
  # afford to yield — which is exactly the priority the shared group had backwards.
  group: index-compaction
  cancel-in-progress: false

env:
  HF_DATASET: imPoseidon/headstart-index
  HF_SPACE: imPoseidon/headstart-search
  # Fetch over the plain resolve/CDN path rather than Xet (ADR-0036). Both get 429'd by this
  # repo; only the plain path survives one, because huggingface_hub retries it internally where
  # the Xet path raised and killed the whole fetch. This job matters most: it is the only thing
  # that reduces the file count, so when it fails the count grows until nothing can fetch at all.
  HF_HUB_DISABLE_XET: "1"

jobs:
  # Hold the door open until the pipeline lets go — and if it does not, come back rather than
  # give up. Split from `cleanup` so a blocked attempt can end without running any of the work.
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      proceed: ${{ steps.wait.outputs.proceed }}
    steps:
      # **This wait is what creates the window it is waiting for.** The pipeline runs 80-130
      # minutes and fires hourly, so it is busy nearly all the time and there is no free gap to
      # arrive into. Once this job exists, the pipeline's gate stands every later fire down, so
      # the one already in flight drains and nothing replaces it. Exiting immediately instead of
      # waiting would look tidier and would never compact again.
      #
      # 45 minutes per attempt, then re-dispatch. A single long wait was the first shape here, and
      # it had to be justified by "no pipeline has ever run past 240 minutes" — the same kind of
      # rare-case tolerance that caused the outage this whole change is fixing (the old comment
      # read "tolerated, because compaction is idempotent and simply runs the next day"). Coming
      # back is a guarantee; a long-enough timeout is an estimate. It also stops a runner idling
      # for four hours, and sidesteps GitHub's 6-hour ceiling on a single job entirely.
      #
      # `workflow_dispatch` is one of the two events the default `GITHUB_TOKEN` may still trigger
      # (docs: "events triggered by the GITHUB_TOKEN will not create a new workflow run, with the
      # following exceptions"), so this needs no PAT.
      - name: Wait for the pipeline to let go, or come back later
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
        run: |
          for _ in $(seq 1 45); do
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow=pipeline.yml \
                  --status in_progress --json databaseId --jq 'length')
            if [ "$n" = "0" ]; then
              echo "no pipeline in flight — compacting"
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pipeline in flight ($n); re-checking in 60s"
            sleep 60
          done
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          # Bounded, so a pipeline that never yields surfaces as a red run instead of an
          # invisible loop. Six attempts is ~4.5 hours of patience against a 130-minute worst
          # case observed over ten runs.
          if [ "$ATTEMPT" -ge 6 ]; then
            echo "::error::a pipeline has been in flight across $ATTEMPT attempts; not compacting"
            exit 1
          fi
          next=$((ATTEMPT + 1))
          gh workflow run cleanup-index.yml -R "$GITHUB_REPOSITORY" -f "attempt=$next"
          echo "still blocked — re-dispatched as attempt $next"

  cleanup:
    needs: window
    if: needs.window.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[embed]" huggingface_hub
      - name: Download the current lancedb
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          df -h / | tail -1
          python -m headstart.ingest.state_fetch 'data/lancedb/*'
          du -sh data/lancedb
      - name: Prune stale + duplicate rows
        run: python -m headstart.ingest.index prune --apply
      - name: Rebuild fresh (reclaim orphan fragments)
        run: python -m headstart.ingest.index compact
      - name: Compact the description store (ADR-0050)
        # Folds each ATS's per-run fragments into its base file. Never fatal: a failure here only
        # leaves more fragments to read next run, and must not sink the index cleanup.
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m headstart.ingest.state_fetch 'data/descriptions/*' || exit 0
          python -m headstart.ingest.update_descriptions --compact
          hf upload "$HF_DATASET" data/descriptions data/descriptions \
            --repo-type dataset --delete "*" \
            --commit-message "cleanup: compact the description store (ADR-0050)"
      - name: Upload the cleaned index
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          du -sh data/lancedb
          hf upload "$HF_DATASET" data/lancedb data/lancedb \
            --repo-type dataset --delete "*" --commit-message "cleanup: prune + rebuild fresh (ADR-0023)"
      - name: Restart the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).restart_space(os.environ['HF_SPACE'])
          print('space restarted')
          "

name: cleanup-index

# Index cleanup (ADR-0023): download the served LanceDB index, prune stale and duplicate rows,
# rebuild it fresh to reclaim orphan fragments, re-upload the compacted index, and restart the
# Space. Runs on Actions (roomy disk, the HF_TOKEN secret, fast network) — never locally.
#
# Now also the pipeline's periodic compaction. `index compact` used to run on EVERY pipeline run,
# which rebuilt the table into one new .lance file each time — a brand-new ~755 MB blob that HF
# stores in full and retains forever, filling the 100 GB quota in ~45 runs. Between compactions
# Lance simply appends: `sync`/`prune` write small new fragments and leave the existing file alone,
# so a run uploads ~10% of the table instead of all of it.
#
# Daily, not weekly: Lance's own guidance is to optimize after ~20 data-modification operations,
# and the pipeline does several per run. Fragments accumulating between compactions is the
# deliberate trade — more files to open per query, reclaimed here. It also compacts the ADR-0050
# description store, whose per-run fragments accumulate on the same principle.
#
# Was every 2 days. Daily doubles the ~755 MB rebuild's blob churn, which the Sunday history squash
# still bounds to a week (~5.3 GB against a 100 GB quota). The real cost is contention: this job
# shares the pipeline's concurrency group and can run 90 minutes, so a pipeline run queues behind
# it once more per two days.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC, clear of the pipeline's :30 slots and the Sunday 04:00 squash
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-pipeline # share the pipeline's group so cleanup and a nightly never race on state
  cancel-in-progress: false

env:
  HF_DATASET: imPoseidon/headstart-index
  HF_SPACE: imPoseidon/headstart-search
  # Fetch over the plain resolve/CDN path rather than Xet (ADR-0036). Both get 429'd by this
  # repo; only the plain path survives one, because huggingface_hub retries it internally where
  # the Xet path raised and killed the whole fetch. This job matters most: it is the only thing
  # that reduces the file count, so when it fails the count grows until nothing can fetch at all.
  HF_HUB_DISABLE_XET: "1"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[embed]" "huggingface_hub[cli]"
      - name: Download the current lancedb
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          df -h / | tail -1
          python -m headstart.ingest.state_fetch 'data/lancedb/*'
          du -sh data/lancedb
      - name: Prune stale + duplicate rows
        run: python -m headstart.ingest.index prune --apply
      - name: Rebuild fresh (reclaim orphan fragments)
        run: python -m headstart.ingest.index compact
      - name: Compact the description store (ADR-0050)
        # Folds each ATS's per-run fragments into its base file. Never fatal: a failure here only
        # leaves more fragments to read next run, and must not sink the index cleanup.
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m headstart.ingest.state_fetch 'data/descriptions/*' || exit 0
          python -m headstart.ingest.update_descriptions --compact
          hf upload "$HF_DATASET" data/descriptions data/descriptions \
            --repo-type dataset --delete "*" \
            --commit-message "cleanup: compact the description store (ADR-0050)"
      - name: Upload the cleaned index
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          du -sh data/lancedb
          hf upload "$HF_DATASET" data/lancedb data/lancedb \
            --repo-type dataset --delete "*" --commit-message "cleanup: prune + rebuild fresh (ADR-0023)"
      - name: Restart the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).restart_space(os.environ['HF_SPACE'])
          print('space restarted')
          "

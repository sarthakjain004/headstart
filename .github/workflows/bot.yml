name: telegram-bot

# Polls Telegram for /start + filter commands and sends new-job alerts.
# Inert (green no-op) until the secrets below are set — see docs/telegram-bot.md.
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay scheduled runs)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: telegram-bot         # never let two runs race on the shared gist state
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run bot (skips cleanly until secrets are set)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STATE_GIST_TOKEN: ${{ secrets.STATE_GIST_TOKEN }}
          STATE_GIST_ID: ${{ secrets.STATE_GIST_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$STATE_GIST_TOKEN" ] || [ -z "$STATE_GIST_ID" ]; then
            echo "Telegram secrets not set - skipping. See docs/telegram-bot.md."
            exit 0
          fi
          python -m headstart.bot

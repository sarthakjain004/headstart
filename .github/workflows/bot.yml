name: telegram-bot

# Polls Telegram for /start and the master's /allow, /deny, /revoke (ADR-0038).
# Enrolment only — Digests are sent by alerts.yml, ranked by the same shortlist as email.
# Inert (green no-op) until the secrets below are set — see docs/telegram-alerts.md.
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay scheduled runs)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: telegram-bot         # never let two runs race on the shared registry
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tags are mutable — cf. tj-actions
      # CVE-2025-30066). Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # `[alerts]` for huggingface_hub: the bot reads and writes Subscription records
      # in the dataset now, where the retired keyword bot only touched a Gist over
      # stdlib urllib and base deps were enough (ADR-0038).
      - run: pip install -e ".[alerts]"
      - name: Run bot (skips cleanly until secrets are set)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUBSCRIBERS_REPO: ${{ vars.SUBSCRIBERS_REPO }}
          SUBSCRIBERS_TOKEN: ${{ secrets.SUBSCRIBERS_TOKEN }}
        run: python -m headstart.alerts.bot

name: pipeline-smoke

# End-to-end smoke for the ingest path (ADR-0025 Phase 1), on a tiny synthetic corpus with the real
# encoder — no HF_TOKEN, no production state. It runs the stages the way the pipeline does (shard
# fragments -> join -> tech filter -> embed -> merge -> sync -> prune) over **two cycles**, because
# the failures worth catching only exist *between* runs:
#
#   cycle 1 — proves the sharded path (plan -> embed --assignment -> merge) yields the SAME vectors
#     as the monolith, that the merged store syncs into a real LanceDB index, and that `prune` plus
#     a re-`sync` then leave those rows exactly as they are (no add/evict ping-pong — PR #102).
#   cycle 2 — a second scrape of the same two Boards in which one Job is genuinely delisted and the
#     other Board **gave up mid-scrape and returned a truncated list, without raising**. Eviction
#     must follow the first and not the second. A single cycle against an empty table cannot
#     express that at all, which is how the eightfold index flap (whole NVIDIA/Qualcomm Boards
#     evicted one run and re-added the next, ~2 h invisible to users) shipped past this workflow.
#
# Runs on demand and when the ingest path changes.
on:
  workflow_dispatch:
  push:
    paths:
      - "src/headstart/ingest/**"
      - ".github/workflows/pipeline-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[embed]"
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-model-nomic-embed-text-v1.5

      # ── Cycle 1 ─────────────────────────────────────────────────────────────────────────────
      - name: Cycle 1 — a healthy two-Board scrape, written as shard fragments
        run: |
          python - <<'PY'
          import json, pathlib
          from headstart.config import load_active_companies

          # Real Boards taken from the committed liveness ledger, not invented slugs: `index prune`
          # evicts every row whose Board is not live in the ledger, so a made-up slug would be
          # pruned away and the prune assertion below would pass for the wrong reason. eightfold is
          # the ATS the flap was measured on (its slug is a host, so it also exercises `board_key()`
          # mapping); lever is the cheap control.
          first = {}
          for c in load_active_companies("data/validate/liveness", min_jobs=0):
              first.setdefault(c.ats, c)
          healthy, flaky = first["lever"], first["eightfold"]
          base = "We build and operate large scale distributed backend systems in Python and Go. "

          def job(board, n, title, reps):
              return {
                  "id": f"{board.ats}:{board.slug}:{n}", "ats": board.ats, "company": board.name,
                  "title": f"{title} {n}", "location": "Remote", "remote": True,
                  "employment_type": "full-time", "experience": None, "salary": None,
                  "department": "Engineering", "url": f"https://example.test/{board.ats}/{n}",
                  "posted_at": "2026-07-01", "description": base * reps,
              }

          def write_shard(k, ats, slug, jobs, error=None):
              d = pathlib.Path(f"data/scrape/fragments/shard-{k}")
              d.mkdir(parents=True, exist_ok=True)
              (d / f"{ats}.jsonl").write_text(
                  "".join(json.dumps(j) + "\n" for j in jobs), encoding="utf-8")
              # The shape `headstart.ingest.observability.write_shard` emits — today the only place
              # a Board's scrape *outcome* is recorded, and the input any fix for the flap needs.
              (d / "_shard_report.json").write_text(json.dumps({
                  "shard": str(k), "assigned": 1, "done": 1, "undone": 0, "jobs": len(jobs),
                  "killed_by_budget": False,
                  "errors": {f"{ats}:{slug}": error} if error else {},
              }), encoding="utf-8")

          # Varied description lengths -> several token buckets, so the fan-out really splits.
          write_shard(0, healthy.ats, healthy.slug, [
              job(healthy, n, "Senior Software Engineer", 1 if n < 6 else (40 if n < 8 else 120))
              for n in range(10)])
          write_shard(1, flaky.ats, flaky.slug, [
              job(flaky, n, "Backend Engineer", 1) for n in range(6)])
          pathlib.Path("data/scrape/boards.json").write_text(json.dumps({
              "healthy": {"ats": healthy.ats, "slug": healthy.slug},
              "flaky": {"ats": flaky.ats, "slug": flaky.slug},
          }), encoding="utf-8")
          print(f"wrote 10 jobs on {healthy.ats}:{healthy.slug}, 6 on {flaky.ats}:{flaky.slug}")
          PY
      # The snapshot in data/jobs is what defines the eviction scope (ADR-0014), and it is the join
      # that builds it — hand-writing data/jobs would skip the stage that decides which Boards sync
      # is even allowed to evict from.
      - name: Union the fragments, then tech-filter them into the corpus
        run: |
          python -m headstart.ingest.scrape_join
          python -m headstart.ingest.filter_tech
      - name: Monolith embed (the baseline to match)
        run: python -m headstart.ingest.embed_run --source data/jobs/tech --outdir data/embeddings/mono
      - name: Plan the fan-out (no prior store → all new; forced multi-shard)
        run: python -m headstart.ingest.embed_plan --max-shards 3 --target-seconds 20
      - name: Embed each shard (real encoder, --assignment mode)
        run: |
          for f in data/embeddings/assignments/shard-*.jsonl; do
            k=$(basename "$f" .jsonl | sed 's/shard-//')
            echo "::group::shard $k"
            python -m headstart.ingest.embed_run --assignment "$f" --outdir "data/embeddings/fragments/shard-$k"
            echo "::endgroup::"
          done
      - name: Merge the fragments into the store
        run: python -m headstart.ingest.embed_merge
      - name: Assert sharded == monolith (same ids, same vectors)
        run: |
          python - <<'PY'
          import json, pathlib
          import numpy as np

          def load(d):
              d = pathlib.Path(d)
              dim = json.loads((d / "manifest.json").read_text())["dim"]
              metas = [json.loads(x) for x in (d / "meta.jsonl").read_text().splitlines() if x.strip()]
              vecs = np.fromfile(d / "embeddings.f32", dtype="float32").reshape(-1, dim)
              return {m["id"]: vecs[i] for i, m in enumerate(metas)}

          mono = load("data/embeddings/mono")
          shard = load("data/embeddings/jobs")
          assert len(mono) == 16, f"monolith embedded {len(mono)}, expected 16"
          assert set(mono) == set(shard), f"id set differs: {set(mono) ^ set(shard)}"
          for k in mono:
              assert np.allclose(mono[k], shard[k], atol=1e-4), f"vector differs for {k}"
          print(f"OK: {len(shard)} ids, sharded vectors match the monolith")
          PY
      - name: Sync the merged store into a real index
        run: python -m headstart.ingest.index sync
      - name: Assert the index holds every job
        run: |
          python - <<'PY'
          import lancedb
          from headstart.search import PROD_TABLE
          t = lancedb.connect("data/lancedb").open_table(PROD_TABLE)
          n = t.count_rows()
          assert n == 16, f"index has {n} rows, expected 16"
          print(f"OK: index synced with {n} rows")
          PY
      # The churn class PR #102 chased: prune deletes a row sync just wrote, the next sync re-adds
      # it, forever. `first_seen` is the detector — sync stamps a row afresh whenever it *re-*adds
      # it (ADR-0031), so an unchanged stamp map is proof no row left and came back.
      - name: Assert prune + a re-sync churn nothing
        run: |
          cat > "$RUNNER_TEMP/stamps.py" <<'PY'
          import json, lancedb
          from headstart.search import PROD_TABLE
          t = lancedb.connect("data/lancedb").open_table(PROD_TABLE)
          rows = t.search().limit(max(t.count_rows(), 1)).to_list()
          print(json.dumps({r["id"]: r["first_seen"] for r in rows}, sort_keys=True, indent=1))
          PY
          python "$RUNNER_TEMP/stamps.py" > "$RUNNER_TEMP/before.json"
          python -m headstart.ingest.index prune --apply
          python -m headstart.ingest.index sync
          python "$RUNNER_TEMP/stamps.py" > "$RUNNER_TEMP/after.json"
          diff "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" && echo "OK: prune + re-sync left every row alone" || {
            echo "::error::prune/sync churned rows they should have left alone — a Board live in the ledger lost or re-acquired rows on a no-op cycle"
            exit 1
          }

      # ── Cycle 2 ─────────────────────────────────────────────────────────────────────────────
      # The bug this workflow exists to catch. Two Boards change in different ways, and only one of
      # the changes is a real delisting.
      - name: Cycle 2 — one Job genuinely delisted, one Board's list truncated mid-scrape
        run: |
          python - <<'PY'
          import json, pathlib
          boards = json.loads(pathlib.Path("data/scrape/boards.json").read_text())
          healthy, flaky = boards["healthy"], boards["flaky"]

          def rewrite(k, board, lines, error=None, truncated=None):
              d = pathlib.Path(f"data/scrape/fragments/shard-{k}")
              path = d / f"{board['ats']}.jsonl"
              kept = path.read_text(encoding="utf-8").splitlines(keepends=True)
              path.write_text("".join(lines(kept)), encoding="utf-8")
              report = json.loads((d / "_shard_report.json").read_text())
              key = f"{board['ats']}:{board['slug']}"
              report["errors"] = {key: error} if error else {}
              report["truncated"] = {key: truncated} if truncated else {}
              (d / "_shard_report.json").write_text(json.dumps(report), encoding="utf-8")

          # Healthy Board: a clean, complete scrape that legitimately no longer lists job :0.
          rewrite(0, healthy, lambda lines: lines[1:])
          # Flaky Board: page 1 came back, page 2 was rate-limited, and the scraper returned what it
          # had (eightfold's `_api_search` breaks out of its pagination loop on a non-200 —
          # src/headstart/scrapers/eightfold.py — so this is the routine case, not a rare one).
          #
          # Recorded under `truncated`, NOT `errors`: the scraper did not raise, and writing an
          # error here would test a signal the production path cannot emit for this failure. That
          # is what this fixture did before ADR-0053, and it made the test green on a fiction.
          rewrite(1, flaky, lambda lines: lines[:1],
                  truncated="HTTP 429 on page 2 — got 1 of 6 postings")
          print("cycle 2 snapshot: healthy Board -1 job, flaky Board truncated to 1 of 6")
          PY
      - name: Re-join and re-filter the second cycle's snapshot
        run: |
          python -m headstart.ingest.scrape_join
          python -m headstart.ingest.filter_tech
      - name: Sync the second cycle
        run: python -m headstart.ingest.index sync
      - name: Assert eviction follows delisting, not scrape failure
        run: |
          python - <<'PY'
          import json, pathlib
          import lancedb
          from headstart.search import PROD_TABLE

          boards = json.loads(pathlib.Path("data/scrape/boards.json").read_text())
          healthy, flaky = boards["healthy"], boards["flaky"]
          hid = lambda n: f"{healthy['ats']}:{healthy['slug']}:{n}"
          fid = lambda n: f"{flaky['ats']}:{flaky['slug']}:{n}"

          t = lancedb.connect("data/lancedb").open_table(PROD_TABLE)
          ids = {r["id"] for r in t.search().select(["id"]).limit(max(t.count_rows(), 1)).to_list()}

          # A real delisting is now *withheld* for one scrape, not evicted (ADR-0083): one
          # absence cannot tell a closure from a scrape that came back short, so the id is
          # marked Unconfirmed and gets a second look. Cycle 3 below is what proves the guard
          # has not become "never evict anything" — this assertion and that one are a pair, and
          # weakening either turns the other into a test of nothing.
          assert hid(0) in ids, (
              f"{hid(0)} went missing from ONE complete scrape and must be withheld for a "
              "second look, not evicted (ADR-0083)")
          owed = set(pathlib.Path("data/state/unconfirmed_ids.txt").read_text().split())
          assert hid(0) in owed, (
              f"{hid(0)} was withheld but not recorded in unconfirmed_ids.txt — nothing would "
              "make the next cycle evict it, so the withholding would be permanent")
          # ...but the truncated Board's missing Jobs are still open; they were simply not returned.
          # Evicting them is the index flap: they vanish from search for one run cycle and come
          # back in the next, over and over (whole NVIDIA/Qualcomm/Micron Boards, measured 5 runs
          # running). "absent from this run's corpus" is not "closed" when the list was truncated.
          stranded = [fid(n) for n in range(1, 6) if fid(n) not in ids]
          assert not stranded, (
              f"INDEX FLAP: {len(stranded)} Jobs evicted from {flaky['ats']}:{flaky['slug']}, whose "
              f"scrape came back truncated at 1 of 6 postings — e.g. {stranded[:3]}. The Board's "
              "outcome IS carried from the scrape to sync now (ADR-0053), so this failing means "
              "that carrier broke, not that it is missing. Check, in order: did scrape_join write "
              "data/state/unauthoritative_boards.json and does it name this Board; did the key "
              "translation land it in `board_key()` space (a Workday slug is a URL and must become "
              "`ats:company/site`); and did the shard write a `_shard_report.json` at all — a shard "
              "hard-killed by the step timeout writes none, and only ADR-0046's ratio guard covers "
              "that, which exempts Boards under COLLAPSE_FLOOR rows like this one.")

          expected = {hid(n) for n in range(10)} | {fid(n) for n in range(6)}
          assert ids == expected, f"unexpected table contents: {ids ^ expected}"
          print(f"OK: the delisted Job is withheld for a second look, {len(ids)} rows kept; "
                "the truncated Board was left alone")
          PY

      # ── Cycle 3 ─────────────────────────────────────────────────────────────────────────────
      # The other half of ADR-0083. Cycle 2 proved one absence does not evict; this proves a
      # *second* one does — without it the grace period would be indistinguishable from having
      # switched eviction off, which is the failure mode ADR-0055 spent a whole revision undoing.
      - name: Cycle 3 — the same Job is still absent from a second complete scrape
        run: |
          python - <<'PY'
          import json, pathlib
          boards = json.loads(pathlib.Path("data/scrape/boards.json").read_text())
          healthy, flaky = boards["healthy"], boards["flaky"]

          def rewrite(k, board, lines, error=None, truncated=None):
              d = pathlib.Path(f"data/scrape/fragments/shard-{k}")
              path = d / f"{board['ats']}.jsonl"
              kept = path.read_text(encoding="utf-8").splitlines(keepends=True)
              path.write_text("".join(lines(kept)), encoding="utf-8")
              report = json.loads((d / "_shard_report.json").read_text())
              key = f"{board['ats']}:{board['slug']}"
              report["errors"] = {key: error} if error else {}
              report["truncated"] = {key: truncated} if truncated else {}
              (d / "_shard_report.json").write_text(json.dumps(report), encoding="utf-8")

          # Both Boards repeat cycle 2's state: the healthy one is complete and still does not
          # list job :0 (already trimmed by cycle 2, so the fragment is left as-is), and the
          # flaky one is still truncated — so its Jobs must stay protected across both cycles,
          # never accumulating a streak that could evict them.
          rewrite(0, healthy, lambda lines: lines)
          rewrite(1, flaky, lambda lines: lines[:1],
                  truncated="HTTP 429 on page 2 — got 1 of 6 postings")
          print("cycle 3 snapshot: healthy Board still without job :0, flaky Board still truncated")
          PY
      - name: Re-join and re-filter the third cycle's snapshot
        run: |
          python -m headstart.ingest.scrape_join
          python -m headstart.ingest.filter_tech
      - name: Sync the third cycle
        run: python -m headstart.ingest.index sync
      - name: Assert the second consecutive absence finally evicts
        run: |
          python - <<'PY'
          import json, pathlib
          import lancedb
          from headstart.search import PROD_TABLE

          boards = json.loads(pathlib.Path("data/scrape/boards.json").read_text())
          healthy, flaky = boards["healthy"], boards["flaky"]
          hid = lambda n: f"{healthy['ats']}:{healthy['slug']}:{n}"
          fid = lambda n: f"{flaky['ats']}:{flaky['slug']}:{n}"

          t = lancedb.connect("data/lancedb").open_table(PROD_TABLE)
          ids = {r["id"] for r in t.search().select(["id"]).limit(max(t.count_rows(), 1)).to_list()}

          assert hid(0) not in ids, (
              f"{hid(0)} was absent from TWO consecutive complete scrapes and should have been "
              "evicted — the grace period must delay eviction, never cancel it (ADR-0083)")
          # The truncated Board is excluded from the eviction scope every cycle (ADR-0053), so its
          # Jobs never accrue a streak at all. Two truncated cycles must not add up to one eviction.
          stranded = [fid(n) for n in range(1, 6) if fid(n) not in ids]
          assert not stranded, (
              f"INDEX FLAP ACROSS CYCLES: {len(stranded)} Jobs evicted from "
              f"{flaky['ats']}:{flaky['slug']} after two truncated scrapes — e.g. {stranded[:3]}. "
              "An Unauthoritative Board is no evidence, so repeated truncation must never "
              "accumulate into an eviction the way repeated *complete* scrapes do.")

          expected = {hid(n) for n in range(1, 10)} | {fid(n) for n in range(6)}
          assert ids == expected, f"unexpected table contents: {ids ^ expected}"
          print(f"OK: the delisted Job evicted on its second consecutive absence, {len(ids)} rows "
                "kept; the truncated Board was left alone in both cycles")
          PY

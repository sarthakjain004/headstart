name: deploy-space

# Pushes deploy/hf-space/ to the HF Space whenever it changes on main (ADR-0020) — the repo is
# the single source of truth for the Space app. Inert until the HF_TOKEN secret is set.
on:
  push:
    branches: [main]
    # ADR-0156: the Space installs the whole src/headstart package (below), so this list is
    # the tree that ships, not a curated subset of it — a change anywhere under src/headstart/
    # or config/ can change what the Space serves.
    paths: ["deploy/hf-space/**", "src/headstart/**", "config/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  push-space:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tags are mutable — cf. tj-actions
      # CVE-2025-30066). Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Push deploy/hf-space to the Space (skips cleanly until HF_TOKEN is set)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set - skipping. See docs/adr/0020-free-tier-deployment.md."
            exit 0
          fi
          pip install huggingface_hub
          # ADR-0156: the Space installs `headstart` as a real package rather than a
          # hand-picked file list — one directory copy each, so nothing can be forgotten from
          # one side of a two-list sync the way role_families.json (#115) and
          # role_watchlist.json (#128) were. src/headstart is the single source of truth
          # (unit-tested there); the Dockerfile COPYs both dirs into the image unchanged.
          rm -rf deploy/hf-space/headstart
          cp -r src/headstart deploy/hf-space/headstart
          find deploy/hf-space/headstart -name '__pycache__' -type d -exec rm -rf {} +
          rm -rf deploy/hf-space/config
          cp -r config deploy/hf-space/config
          # upload_folder, not `hf upload`: the CLI pre-creates the repo, and HF now answers
          # Docker-Space creates with a 402 paywall (new free Docker Spaces are PRO-only).
          # Ours exists and keeps running — targeting it directly needs no create call.
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi().upload_folder(
              folder_path="deploy/hf-space",
              repo_id="imPoseidon/headstart-search",
              repo_type="space",
              commit_message=f"deploy: sync Space from repo {os.environ['GITHUB_SHA'][:7]}",
          )
          PY

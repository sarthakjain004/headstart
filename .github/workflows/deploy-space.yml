name: deploy-space

# Pushes deploy/hf-space/ to the HF Space whenever it changes on main (ADR-0020) — the repo is
# the single source of truth for the Space app. Inert until the HF_TOKEN secret is set.
on:
  push:
    branches: [main]
    # ADR-0290: only a change the Space loads deploys it, since every deploy boots a new
    # container for about six minutes. That means the headstart modules deploy/hf-space/app.py
    # imports at load, plus ui/ and all of config/, which it reads files from. The copy below
    # still ships the whole package (ADR-0156), so any other change rides along with the next
    # deploy. tests/test_space_deploy_trigger.py loads the app and fails if a module it loads is
    # missing here, if a module it never loads is listed, or if a function of a loaded module
    # imports one it does not load.
    paths:
      - "deploy/hf-space/**"
      - "config/**"
      - "src/headstart/ui/**"
      - "src/headstart/__init__.py"
      - "src/headstart/embedding_conventions.py"
      - "src/headstart/llm_router.py"
      - "src/headstart/log.py"
      - "src/headstart/alerts/__init__.py"
      - "src/headstart/alerts/access.py"
      - "src/headstart/alerts/identity.py"
      - "src/headstart/alerts/store.py"
      - "src/headstart/boards/__init__.py"
      - "src/headstart/boards/board_identity.py"
      - "src/headstart/boards/board_operator.py"
      - "src/headstart/boards/company_name.py"
      - "src/headstart/boards/company_ref.py"
      - "src/headstart/jobs/__init__.py"
      - "src/headstart/jobs/job.py"
      - "src/headstart/jobs/location.py"
      - "src/headstart/jobs/requisition_copies.py"
      - "src/headstart/jobs/salary.py"
      - "src/headstart/jobs/work_authorization.py"
      - "src/headstart/mcp_protocol/**"
      - "src/headstart/search_filters/**"
      - "src/headstart/serving/**"
      - "src/headstart/space_mcp/**"
      - "src/headstart/trends/**"
      # The local stdio entry point (ADR-0253). A negation must follow the positive patterns.
      - "!src/headstart/space_mcp/__main__.py"
  workflow_dispatch: {}

permissions:
  contents: read

# A merge landing while an earlier deploy's upload still runs cancels it: the newer checkout
# holds every earlier change, and upload_folder's commit is all or nothing (ADR-0290). Only a
# newer checkout of the same ref does, so the group is per ref: a dispatch from a branch never
# cancels main's deploy.
concurrency:
  group: deploy-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-space:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tags are mutable — cf. tj-actions
      # CVE-2025-30066). Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Push deploy/hf-space to the Space (skips cleanly until HF_TOKEN is set)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set - skipping. See docs/adr/0020-free-tier-deployment.md."
            exit 0
          fi
          pip install "huggingface_hub<2"  # one major across the workflows, as in pipeline.yml
          # ADR-0156: the Space installs `headstart` as a real package rather than a
          # hand-picked file list — one directory copy each, so nothing can be forgotten from
          # one side of a two-list sync the way role_families.json (#115) and
          # role_watchlist.json (#128) were. src/headstart is the single source of truth
          # (unit-tested there); the Dockerfile COPYs both dirs into the image unchanged.
          rm -rf deploy/hf-space/headstart
          cp -r src/headstart deploy/hf-space/headstart
          find deploy/hf-space/headstart -name '__pycache__' -type d -exec rm -rf {} +
          rm -rf deploy/hf-space/config
          cp -r config deploy/hf-space/config
          # upload_folder, not `hf upload`: the CLI pre-creates the repo, and HF now answers
          # Docker-Space creates with a 402 paywall (new free Docker Spaces are PRO-only).
          # Ours exists and keeps running — targeting it directly needs no create call.
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi().upload_folder(
              folder_path="deploy/hf-space",
              repo_id="imPoseidon/headstart-search",
              repo_type="space",
              commit_message=f"deploy: sync Space from repo {os.environ['GITHUB_SHA'][:7]}",
          )
          PY

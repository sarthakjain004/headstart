name: deploy-space

# Pushes deploy/hf-space/ to the HF Space whenever it changes on main (ADR-0020) — the repo is
# the single source of truth for the Space app. Inert until the HF_TOKEN secret is set.
on:
  push:
    branches: [main]
    # src/headstart modules deployed into the Space are copied in below
    paths:
      [
        "deploy/hf-space/**",
        "src/headstart/facets.py",
        "src/headstart/geo.py",
        "src/headstart/llm_router.py",
        "src/headstart/profile_extract.py",
        "src/headstart/search.py",
        "src/headstart/alerts/**",
        "src/headstart/ui/**",
        # shipped into the image too — a reworded label must reach the Space
        "config/role_families.json",
        "config/role_watchlist.json",
      ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  push-space:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tags are mutable — cf. tj-actions
      # CVE-2025-30066). Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Push deploy/hf-space to the Space (skips cleanly until HF_TOKEN is set)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set - skipping. See docs/adr/0020-free-tier-deployment.md."
            exit 0
          fi
          pip install huggingface_hub
          # these live in src/headstart (single source of truth, unit-tested there); the
          # standalone Space app imports them as sibling modules
          cp src/headstart/facets.py deploy/hf-space/facets.py
          cp src/headstart/geo.py deploy/hf-space/geo.py
          cp src/headstart/llm_router.py deploy/hf-space/llm_router.py
          cp src/headstart/profile_extract.py deploy/hf-space/profile_extract.py
          cp src/headstart/search.py deploy/hf-space/search.py
          # Curated role taxonomy (ADR-0040): the ledger stores family slugs, the chart shows
          # these labels. Same single-source-of-truth reason as the modules above.
          cp config/role_families.json deploy/hf-space/role_families.json
          cp config/role_watchlist.json deploy/hf-space/role_watchlist.json
          # A package, not a flat file: its members import each other relatively, so the same
          # directory works as `headstart.alerts` in the repo and as top-level `alerts` here.
          rm -rf deploy/hf-space/alerts
          cp -r src/headstart/alerts deploy/hf-space/alerts
          find deploy/hf-space/alerts -name '__pycache__' -type d -exec rm -rf {} +
          # The UI (templates + static) — single source in src/headstart/ui, synced like
          # the modules above.
          rm -rf deploy/hf-space/templates deploy/hf-space/static
          cp -r src/headstart/ui/templates deploy/hf-space/templates
          cp -r src/headstart/ui/static deploy/hf-space/static
          # upload_folder, not `hf upload`: the CLI pre-creates the repo, and HF now answers
          # Docker-Space creates with a 402 paywall (new free Docker Spaces are PRO-only).
          # Ours exists and keeps running — targeting it directly needs no create call.
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi().upload_folder(
              folder_path="deploy/hf-space",
              repo_id="imPoseidon/headstart-search",
              repo_type="space",
              commit_message=f"deploy: sync Space from repo {os.environ['GITHUB_SHA'][:7]}",
          )
          PY

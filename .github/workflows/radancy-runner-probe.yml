# Why do a runner's job-page requests to Radancy's fronts get 403, and does the spare egress fix it?
#
# `docs/radancy/2026-09-29_detail-page-403-wall.md` and ADR-0346 measured, from Actions logs, that
# 12.1% to 36.0% of a run's Radancy job pages are refused, unevenly across shards and runs, while a
# laptop reads every page it asks for. What logs and a laptop cannot show, and this can, from the
# vantage production actually uses: the refused response itself, whether the refusal is the
# address or the request rate, how long it lasts, whether another client passes where the scraper's
# does not, and whether Cloudflare WARP (the spare egress ADR-0346 routes a refused shard onto)
# passes what the runner's own address does not. `scripts/bench/probe_radancy_runner_refusal.py`
# holds the arms and their stop rules; its docstring says how to read each.
#
# Manual only. A replica sends at most about 3,000 requests (two Boards read one a second for up
# to 300 pages, then bursts of 300 at 16 streams on three Boards, direct and through WARP, and a
# second burst after a rotation), against ~115,000 job pages in one production run. The script
# stops a Board at its first refusal, so a refused Board costs a handful more requests, not a walk,
# and a typical replica sends far fewer.
#
# Three replicas, because one runner is one address and the whole question is whether the outcome
# is a property of the address: production has shards that lose nothing beside shards that lose
# above 45% in the same run. Each replica records its address only as a hash, so two replicas
# that came up on one address show as one.
#
# Nothing here can write: `contents: read`, no secret and no Hugging Face token is referenced, and
# the repository token is not left in the checkout. The repository is public, so the script keeps
# no cookie value and no address, and scrubs any response that echoes one.
name: radancy-runner-probe

on:
  workflow_dispatch:
    inputs:
      hosts:
        description: test Boards, comma-separated hostnames (walled on a runner after ~260 pages)
        default: jobs.jabil.com,careers.sysco.com
      control:
        description: a Board a runner read whole in each of three runs (3,863 pages)
        default: careers.petco.com
      sitemap_host:
        description: a Board whose sitemap a runner was refused (read for the client comparison)
        default: careers.staples.com
      pages:
        description: sequential pages per test Board, one a second (max 400)
        default: "300"
      burst_n:
        description: requests per burst at 16 streams, per Board and route (max 400)
        default: "300"
      arms:
        description: "comma-separated subset; fixed order: where,sitemap,sequential,burst,warp"
        default: "where,sitemap,sequential,burst,warp"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # hang detector; the script skips arms it has no time for at 12 minutes
    strategy:
      fail-fast: false # one replica's outcome must not cancel the other samples
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Base deps only: `curl_cffi` (the scraper's whole request path) and `requests`. No browser
      # stack, no `[scrape]` extra, nothing that reads a credential.
      - run: pip install -e .
      - name: Install Cloudflare WARP (spare egress, ADR-0063)
        # The executable half of pipeline.yml's step of the same name, condensed: the GUI-dependency
        # stubs and every ceiling are load-bearing and measured, so they are copied rather than
        # simplified, but the rationale lives there and is not repeated here. Same contract — never
        # fatal, `spare_egress.proxy_url()` returns None on a runner without it and the `warp` arm
        # reports that it was skipped rather than failing the probe.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -x
          stub_gui_deps() {
            sudo DEBIAN_FRONTEND=noninteractive timeout 60 apt-get install -y -qq \
              -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=2 \
              equivs || return 1
            local d
            d=$(mktemp -d)
            for p in libwebkit2gtk-4.1-0 libayatana-appindicator3-1; do
              printf 'Section: misc\nPriority: optional\nStandards-Version: 3.9.2\nPackage: %s-headless-stub\nProvides: %s\nDescription: stub for headless warp-svc\n A no-op package satisfying a GUI dependency warp-svc never calls.\n' \
                "$p" "$p" > "$d/$p.ctl"
              (cd "$d" && equivs-build "$p.ctl" >/dev/null) || return 1
            done
            sudo dpkg -i "$d"/*headless-stub*.deb >/dev/null || return 1
          }
          if ! stub_gui_deps; then
            echo "warp: GUI dependency stubs unavailable — full install" >&2
            sudo timeout 20 dpkg --configure -a >/dev/null 2>&1 || true
          fi
          install_warp() {
            curl -fsSL --max-time 15 --retry 1 --retry-delay 2 \
              https://pkg.cloudflareclient.com/pubkey.gpg \
              | sudo gpg --yes --dearmor \
                -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg || return 1
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo timeout 45 apt-get update -qq \
              -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
              -o Acquire::Retries=2 \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/cloudflare-client.list \
              -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 || true
            sudo timeout 60 apt-get install -y -qq \
              -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
              -o Acquire::Retries=2 cloudflare-warp || return 1
          }
          if ! install_warp; then
            echo "warp install attempt 1 failed — retrying" >&2
            sleep 20
            install_warp || echo "warp install attempt 2 failed — degrading to direct" >&2
          fi
          sudo timeout 15 systemctl start warp-svc || true
          for _ in $(seq 1 15); do
            timeout 5 warp-cli --accept-tos status >/dev/null 2>&1 && break
            sleep 1
          done
          timeout 30 warp-cli --accept-tos registration new || true
          timeout 15 warp-cli --accept-tos status || true
      - name: Probe
        timeout-minutes: 14
        # Dispatch inputs arrive through `env:` rather than being interpolated into the script, so
        # a value carrying shell metacharacters is data, not code; the script also refuses any
        # host that is not a bare hostname and caps both request counts at 400.
        env:
          HOSTS: ${{ github.event.inputs.hosts }}
          CONTROL: ${{ github.event.inputs.control }}
          SITEMAP_HOST: ${{ github.event.inputs.sitemap_host }}
          PAGES: ${{ github.event.inputs.pages }}
          BURST_N: ${{ github.event.inputs.burst_n }}
          ARMS: ${{ github.event.inputs.arms }}
        run: |
          # OUT first, before anything that can fail: the steps below glob `$OUT.*`, and an unset
          # OUT would make that `.*`, every dotfile in the workspace.
          out="radancy-runner-probe_${{ github.run_id }}_replica-${{ matrix.replica }}"
          echo "OUT=$out" >> "$GITHUB_ENV"
          python -u scripts/bench/probe_radancy_runner_refusal.py \
            --hosts "$HOSTS" \
            --control "$CONTROL" \
            --sitemap-host "$SITEMAP_HOST" \
            --pages "$PAGES" \
            --burst-n "$BURST_N" \
            --arms "$ARMS" \
            --replica "${{ matrix.replica }}" \
            --out "$out.json" 2>&1 | tee "$out.log"
      - name: Summarize
        # From the checkpointed JSON, so a probe the step timeout cut off still reports what it
        # had reached. The summary is also uploaded, next to the JSON and the log.
        if: always()
        run: |
          out="radancy-runner-probe_${{ github.run_id }}_replica-${{ matrix.replica }}"
          python scripts/bench/probe_radancy_runner_refusal.py \
            --render "$out.json" --replica "${{ matrix.replica }}" | tee "$out.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: radancy-runner-probe-replica-${{ matrix.replica }}
          path: ${{ env.OUT }}.*
          retention-days: 14
          if-no-files-found: warn

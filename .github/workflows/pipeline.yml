name: nightly-pipeline

# Nightly ingest for the free-tier deployment (ADR-0020): scrape a priority-first slice of the
# live boards (tech-yielding boards first, random exploration tail — ADR-0022), filter to tech,
# embed only the new ids (highest-priority boards first), incrementally sync the LanceDB `jobs`
# table, and push the updated state to the private HF dataset the Space serves from.
# Inert (green no-op) until the HF_TOKEN secret is set.
on:
  schedule:
    # four cycles a day, 6h apart: the 21:30 nightly plus day runs that give the CPU
    # embed budget more slots (heals eviction backlogs, keeps boards ~2-3 days fresh
    # instead of ~9-10). Runs serialize via the concurrency group; once a backlog is
    # gone, day runs shrink to ~30-45 min (few new ids per slice).
    - cron: "30 21 * * *" # the compulsory nightly
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      max_boards:
        description: boards to scrape this run (0 = all live boards)
        default: "8000"

permissions:
  contents: read

concurrency:
  group: nightly-pipeline # never let two runs race on the dataset state
  cancel-in-progress: false

env:
  HF_DATASET: imPoseidon/headstart-index
  HF_SPACE: imPoseidon/headstart-search

jobs:
  harvest-embed-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Actions pinned to full commit SHAs (tags are mutable — cf. tj-actions
      # CVE-2025-30066). Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Check HF_TOKEN (skips cleanly until set)
        id: gate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set - skipping. See docs/adr/0020-free-tier-deployment.md."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        run: pip install -e ".[embed]" "huggingface_hub[cli]"
      - name: Cache the embedding model
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-model-nomic-embed-text-v1.5
      - name: Download index state (empty on first run)
        if: steps.gate.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # snapshot_download, not the hf CLI: `hf download repo --include A B` parses B as a
        # positional filename and silently ignores --include, and the former `|| true` then
        # swallowed the failure — an empty state got rebuilt from one slice and uploaded over
        # the real index (2026-07-05). Zero matches (true first run) succeeds; every real
        # error fails the run before the upload step can do damage.
        run: |
          python -c "
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              os.environ['HF_DATASET'],
              repo_type='dataset',
              local_dir='.',
              allow_patterns=['data/embeddings/jobs/*', 'data/lancedb/*', 'data/state/*'],
              token=os.environ['HF_TOKEN'],
          )
          print('state downloaded')
          "
      - name: Scrape a rotating slice of the live boards (time-budgeted)
        if: steps.gate.outputs.run == 'true'
        # Same pattern as the embed budget: a slice heavy in join/workday boards (per-job
        # detail fetches) can outrun 150 minutes, and a step timeout would fail the run and
        # waste everything. The snapshot streams per-board and partial harvests are safe by
        # design (eviction only touches scraped boards, ADR-0014) — bank what we got.
        run: |
          timeout 140m python scripts/scrape/nightly_harvest.py \
            --max-boards "${{ github.event.inputs.max_boards || '8000' }}" \
            || echo "scrape time budget reached — banking partial snapshot"
        timeout-minutes: 150
      - name: Tech filter
        if: steps.gate.outputs.run == 'true'
        run: python scripts/filter/tech.py
      - name: Update board priority ledger
        if: steps.gate.outputs.run == 'true'
        run: python scripts/rank/update_board_priority.py
      - name: Embed the new ids (time-budgeted — partial progress still uploads)
        if: steps.gate.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # CPU embedding runs ~0.5 docs/s; a backlog-heavy slice can't always finish. The
        # store streams to disk and reconciles on --resume (ADR-0004), so when the budget
        # expires we bank what's embedded and let sync/upload proceed — the next run
        # continues from there. A step-timeout here would instead fail the run and lose
        # the whole slice.
        run: |
          timeout 100m python scripts/embed/embed_jobs.py --resume \
            || echo "embed time budget reached — banking partial store"
        timeout-minutes: 115
      - name: Sync the jobs table
        if: steps.gate.outputs.run == 'true'
        run: python scripts/embed/sync_index.py
      - name: Prune dead-Board and duplicate rows
        if: steps.gate.outputs.run == 'true'
        # Reclaims what the board-scoped sync can't: rows on Boards no longer live (left the scrape
        # list) and case-variant duplicates of the same job (ADR-0023). Aborts itself if the ledger
        # looks broken, so it can't evict a healthy index.
        run: python scripts/embed/prune_index.py --apply
      - name: Compact the table
        if: steps.gate.outputs.run == 'true'
        run: python scripts/embed/compact_index.py
      - name: Upload index state
        if: steps.gate.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Retry each upload — the HF API 504s intermittently on create/commit and a bare failure
          # sinks the whole run (e.g. 2026-07-16). Backs off 30s/60s before giving up.
          up() {
            for attempt in 1 2 3; do
              hf upload "$@" && return 0
              echo "::warning::hf upload attempt $attempt failed; retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            done
            return 1
          }
          up "$HF_DATASET" data/embeddings/jobs data/embeddings/jobs \
            --repo-type dataset --commit-message "nightly: embedding store"
          # --delete prunes remote fragments no longer present locally. compact_index.py rewrites
          # the table into fresh fragment files each run; without --delete the superseded ones pile
          # up in the dataset forever (they hit ~2GB / 51 files, and the free-tier Space could no
          # longer cold-start the download). Keep the served index at its compacted size.
          up "$HF_DATASET" data/lancedb data/lancedb \
            --repo-type dataset --delete "*" --commit-message "nightly: lancedb index"
          up "$HF_DATASET" data/state data/state \
            --repo-type dataset --commit-message "nightly: board priority"
      - name: Restart the Space to pick up the new index
        if: steps.gate.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).restart_space(os.environ['HF_SPACE'])
          print('space restarted')
          "

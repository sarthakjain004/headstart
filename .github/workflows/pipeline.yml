name: nightly-pipeline

# Nightly ingest for the free-tier deployment (ADR-0020), fully parallelized (ADR-0025 embed,
# ADR-0026 scrape):
#   scrape-plan (select slice → bin-pack boards into shards)
#     → scrape (matrix, ≤15 shards, each scrapes its boards into a fragment)
#       → join (union fragments → tech-filter → priority → plan the embed fan-out)
#         → embed (matrix, ≤15 shards, each embeds its Docs into a fragment)
#           → merge (single writer: concatenate → sync → prune → compact → upload → restart).
# Inert (green no-op) until the repo's HF_TOKEN secret is set: the gate in scrape-plan drives
# `run`, and every downstream job/step is gated on it.
#
# Time budget (sized 2026-07-25 against measured run 30131376268 — see
# docs/AI_Integration/embedding-throughput.md for the arithmetic):
#   expected ~171 min, worst case 358 min (sum of job timeouts), against a 360-min cron interval.
# Every stage timeout is one of two kinds, and they are set on opposite principles:
#   - scrape / embed BANK PARTIAL WORK, so their inner `timeout Nm ... || echo` is a *work budget*
#     sized at ~3x the balanced makespan. Truncation is cheap and deliberate: the fragment uploads
#     anyway and the unfinished Boards/Docs re-plan next run.
#   - scrape-plan / join / merge are ALL-OR-NOTHING (no partial output), so their timeouts are pure
#     hang detectors at ~3-4x the estimate. Cutting them early buys nothing and risks a false kill.
#     `join` is the one that matters: it is un-bankable AND every scrape fragment flows through it,
#     so a join timeout discards the whole run's scrape. Keep it generous.
# Three nested clocks, and they measure different spans — mis-sizing the outer two silently defeats
# the banking design:
#   inner `timeout Nm`  -> the work itself; fires first, `|| echo` absorbs it, the upload still runs
#   step `timeout-minutes` -> that one step; must exceed inner + the step's own slack
#   job `timeout-minutes`  -> setup + checkout + `pip install` + EVERY step + upload
# The job margin must therefore cover pre-step setup (~100 s: checkout, setup-python, pip) *plus*
# the upload, not merely exceed the step timeout. A job kill happens mid-step and skips even
# `if: always()` steps, so too thin a job margin loses exactly the partial work the design protects.
on:
  schedule:
    # Every 2h on odd hours, so the 21:30 nightly keeps its slot. Runs serialize via the
    # concurrency group; the interval is shorter than a run (last 12 scheduled runs: min 33 /
    # mean 84 / max 124 min, starting a mean ~97 min after their slot), so cycles queue rather
    # than all fire. Expect fewer than 12 effective runs/day — run duration sets the ceiling.
    #
    # STORAGE BUDGET — the binding constraint, not compute. Each run rewrites ~1.86 GB of LFS
    # blobs (embeddings.f32 948 MB + jobs.lance 755 MB + meta.jsonl 154 MB) and HF retains every
    # prior revision, so the 100 GB dataset quota buys ~54 runs before it must be reclaimed with
    # `super_squash_history` (done 2026-07-27: 263 commits -> 1, 96.8 GB -> 11.1 GB). At this
    # cadence that is roughly 4 days. Check `repo_info(...).used_storage` before assuming
    # headroom; a full quota fails the push mid-run and leaves the dataset half-written.
    - cron: "30 1-23/2 * * *" # includes 21:30, the compulsory nightly
  workflow_dispatch:
    inputs:
      max_boards:
        description: boards to scrape this run (0 = all live boards)
        # 20000 of 59,790 live Boards on enabled ATSes — `scrape_plan` selects with `min_jobs=0`,
        # so that is the count to compare against, not the 45,133 currently-hiring subset. Recount
        # after any liveness sweep rather than trusting this line (it read 52,925 until 2026-08-11):
        #   python -c "from headstart.config import load_active_companies as f; \
        #     print(len(f('data/validate/liveness', min_jobs=0)))"
        # pick_boards splits this **30/70**
        # (EXPLORE_FRAC=0.7, board_priority.py): the top 6,000 scored Boards plus a 14,000-Board
        # random tail. Flipped from 70/30 on 2026-07-27 to work through the unscraped backlog —
        # measured against both HF state ledgers (board_priority ∪ board_cost = 49,449 Boards ever
        # scraped, keyed through each scraper's slug_from), 8,068 live Boards had never been
        # scraped, 4,187 of them Workday. NB the 14,000 tail exceeds that backlog, so once it is
        # cleared the tail is ordinary random resampling, not exploration.
        # Trade-off: the scored head shrinks 14,000 -> 6,000, so top-yield Boards are revisited
        # less often per run. That slows Eviction (a Job only leaves the index when its Board is
        # re-scraped and the posting is gone), partly offset by the 2h cadence.
        # Sizing: that slice carries ~59k more tech postings than the old 8,000, i.e. ~39k new
        # Docs/run, ~126 min of embed across 15 shards at the post-pin-fix 2.89 s/Doc. Overshoot
        # is safe — the embed shards bank whatever finished and the rest rolls into the next run.
        default: "20000"

permissions:
  contents: read

concurrency:
  group: nightly-pipeline # never let two runs race on the dataset state
  cancel-in-progress: false

env:
  HF_DATASET: imPoseidon/headstart-index
  HF_SPACE: imPoseidon/headstart-search
  # Fetch and upload over the plain resolve/CDN path rather than Xet. Both paths get 429'd by
  # this repo — measured 2026-08-05, 22 of them in one download — but only the plain path
  # *survives* it: huggingface_hub retries a 429 internally and recovers, whereas on the Xet
  # path it surfaced as a RuntimeError that killed the whole fetch, leaving state_fetch's own
  # budget re-trying a doomed operation. That took out 21 of 25 runs from 2026-08-02, and the
  # request rate scales with file count, which grows between compactions (ADR-0036).
  HF_HUB_DISABLE_XET: "1"

jobs:
  # ── Stage 1: select this run's board slice and bin-pack it into scrape shards. Downloads only the
  # priority ledger (light); the liveness ledger is committed in the repo.
  scrape-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # hang detector: measured ~40s (the packing itself is ~30ms)
    outputs:
      run: ${{ steps.gate.outputs.run }}
      count: ${{ steps.plan.outputs.count || '0' }}
      shards: ${{ steps.plan.outputs.shards || '[]' }}
    steps:
      # Actions pinned to full commit SHAs (tags are mutable — cf. tj-actions
      # CVE-2025-30066). Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Check HF_TOKEN (skips cleanly until set)
        id: gate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set - skipping. See docs/adr/0020-free-tier-deployment.md."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        run: pip install -e . "huggingface_hub[cli]"
      - name: Download the priority ledger (light; empty on first run)
        if: steps.gate.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m headstart.ingest.state_fetch 'data/state/*'
      - name: Plan the scrape fan-out
        id: plan
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m headstart.ingest.scrape_plan --max-boards "${{ github.event.inputs.max_boards || '20000' }}"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan = json.load(open("data/scrape/assignments/plan.json"))
          print("count=%d" % plan["count"])
          print("shards=%s" % json.dumps(plan["shards"]))
          PY
      - name: Upload scrape assignments (one board list per shard)
        if: steps.gate.outputs.run == 'true' && steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrape-assignments
          path: data/scrape/assignments
          retention-days: 1

  # ── Stage 2: the scrape fan-out. Each shard is one runner (one IP) scraping only its assigned
  # boards at the monolith's default worker count — so every ATS host sees it as one ordinary
  # monolith from a distinct IP (ADR-0026). `fail-fast: false` so one shard's block/timeout doesn't
  # abort the rest; the join takes whatever fragments completed.
  scrape:
    needs: scrape-plan
    if: needs.scrape-plan.outputs.run == 'true' && needs.scrape-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 72 # inner 60m -> step 66m -> job 72m; 6 min covers setup + fragment upload
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: ${{ fromJson(needs.scrape-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Download this shard's board list
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scrape-assignments
          path: data/scrape/assignments
      - name: Scrape the shard (time-budgeted — a banked partial is safe, its boards re-plan next run)
        # 60m, down from the monolith's inherited 140m: at 20,000 Boards a balanced shard is ~13
        # min, so this is ~4.5x headroom and still caps the straggler (run 30131376268 had one
        # shard run 20 min against a 2 min median — 5.2x — while the cost model rated them equal).
        # Partial harvests are safe by design: `JobWriter` flushes per Board, eviction only touches
        # Boards present in the join (ADR-0014), and `|| echo` banks what finished so the step
        # still exits 0 and the upload below runs.
        run: |
          timeout 60m python -m headstart.ingest.scrape_run \
            --assignment "data/scrape/assignments/shard-${{ matrix.shard }}.jsonl" \
            --outdir "data/jobs/shard-${{ matrix.shard }}" \
            || echo "scrape time budget reached — banking partial fragment"
        timeout-minutes: 66
      - name: Upload the shard fragment
        # always(): the `|| echo` above already absorbs the inner timeout, so this is the belt to
        # that braces — if the *step* timeout ever fires instead, the Boards that did finish are
        # on disk and must still reach the join rather than being thrown away.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrape-fragment-${{ matrix.shard }}
          path: data/jobs/shard-${{ matrix.shard }}
          retention-days: 1

  # ── Stage 3: union the scrape fragments into one snapshot, tech-filter, refresh the priority
  # ledger, and plan the embed fan-out (the Phase-1 embed-planner). `if: always()` so it proceeds on
  # whatever scrape fragments completed (partial-harvest safety), gated on the run flag.
  join:
    needs: [scrape-plan, scrape]
    if: always() && needs.scrape-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # ~13 min at 20k Boards: ~90s fixed + ~3.9e-4 s/scraped line, plus embed_plan's tokenize +
    # English gate, which scale with *new Docs* (9,708 -> ~39,000) not lines. 3x that estimate,
    # because join banks nothing and every scrape fragment flows through it.
    timeout-minutes: 40
    outputs:
      count: ${{ steps.plan.outputs.count || '0' }}
      shards: ${{ steps.plan.outputs.shards || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[embed]" "huggingface_hub[cli]"
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          # Distinct key from embed's: embed_plan loads only the TOKENIZER, so a shared
          # key let this job win the race and publish a weightless cache that all 15
          # embed shards then hit, re-downloading ~550 MB each and never re-saving it.
          key: hf-tokenizer-nomic-embed-text-v1.5
      - name: Download meta + priority state (light — the embed diff + ledger blend)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m headstart.ingest.state_fetch 'data/embeddings/jobs/meta.jsonl' 'data/state/*'
          # The description store (ADR-0050). Fetched only here: this is the one job that both
          # writes it (update_descriptions) and reads it (embed_plan, via the repaired corpus).
          # Deliberately NOT under data/state/, whose glob scrape-plan also pulls — that would
          # ship ~174 MB toward a planner that has no use for it.
          python -m headstart.ingest.state_fetch 'data/descriptions/*' || \
            echo "::warning::no description store yet — first run after ADR-0050"
      - name: Download all scrape fragments
        # continue-on-error: take whatever fragments exist. If every scrape shard died before
        # uploading, the join still proceeds and degrades to a safe no-op — an empty data/jobs
        # means an empty scraped-Board set, so `index sync` evicts nothing (ADR-0014).
        if: needs.scrape-plan.outputs.count != '0'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scrape-fragment-*
          path: data/scrape/fragments
      - name: Union the scrape fragments into one snapshot
        run: python -m headstart.ingest.scrape_join
      - name: Tech filter
        run: python -m headstart.ingest.filter_tech
      - name: Reconcile descriptions with the store (ADR-0050)
        # Both directions: persist what this run fetched, and repair corpus rows the scrape left
        # empty. Must run BEFORE embed_plan — it is what stops a Job whose detail fetch failed
        # from being embedded title-only, which is permanent once it lands.
        run: python -m headstart.ingest.update_descriptions
      - name: Update board priority ledger
        run: python -m headstart.ingest.update_ledgers priority
      - name: Update board cost ledger (measured scrape seconds — ADR-0027)
        # Blends the per-shard board_cost.csv timings into data/state/, which merge uploads and
        # the next run's scrape-plan packs on. Never fatal: a missing ledger only costs one run
        # of balance, so it must not sink a run that already scraped and embedded successfully.
        continue-on-error: true
        run: python -m headstart.ingest.update_ledgers cost
      - name: Plan the embed fan-out
        id: plan
        run: |
          python -m headstart.ingest.embed_plan
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan = json.load(open("data/embeddings/assignments/plan.json"))
          print("count=%d" % plan["count"])
          print("shards=%s" % json.dumps(plan["shards"]))
          PY
      - name: Upload embed assignments (one file per shard)
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embed-assignments
          path: data/embeddings/assignments
          retention-days: 1
      - name: Upload corpus + state for the merge job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-state
          path: |
            data/jobs
            data/state
            data/descriptions
          retention-days: 1

  # ── Stage 4: the embed fan-out (unchanged from Phase 1). Each shard embeds its assigned Docs into
  # a fragment; the planner already deduped/bucketed, so shards are stateless.
  embed:
    needs: [scrape-plan, join]
    if: needs.scrape-plan.outputs.run == 'true' && needs.join.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 198 # inner 180m -> step 188m -> job 198m; 10 min covers a cold pip cache
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: ${{ fromJson(needs.join.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[embed]"
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-model-nomic-embed-text-v1.5 # full weights; see the join job's note
      - name: Download this shard's assignment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embed-assignments
          path: data/embeddings/assignments
      - name: Embed the shard (time-budgeted — a banked partial is safe, its ids re-plan next run)
        # 180m, up from 100m, to absorb the bigger --max-boards slice: ~39k new Docs across 15
        # shards is ~126 min at the post-pin-fix 2.89 s/Doc and ~172 min at the pre-fix 3.96, so
        # this covers the run even before `_S_PER_DOC` is recalibrated. Partials are safe:
        # EmbeddingStore flushes vectors then metadata per batch, embed_merge truncates any
        # half-written tail, and the dropped Docs simply reappear in the next run's plan.
        run: |
          timeout 180m python -m headstart.ingest.embed_run \
            --assignment "data/embeddings/assignments/shard-${{ matrix.shard }}.jsonl" \
            --outdir "data/embeddings/fragments/shard-${{ matrix.shard }}" \
            || echo "embed time budget reached — banking partial fragment"
        timeout-minutes: 188
      - name: Upload the shard fragment
        # always(): same reasoning as the scrape upload — vectors already flushed to disk must
        # reach the merge even if the step timeout fires ahead of the inner budget.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embed-fragment-${{ matrix.shard }}
          path: data/embeddings/fragments/shard-${{ matrix.shard }}
          retention-days: 1

  # ── Stage 5: the single writer (unchanged from Phase 1). Pulls the prior store + LanceDB from HF,
  # concatenates the embed fragments, then sync → prune → compact → upload → restart. Runs even when
  # embed was skipped (eviction/prune still needed); every step gated on the run flag.
  merge:
    needs: [scrape-plan, join, embed]
    if: always()
    runs-on: ubuntu-latest
    # hang detector: ~5 min of work at this scale, up to ~4.5 min of `up()` retry backoff across
    # the three HF uploads, and up to ~18 min of state_fetch retries (5 partial downloads of the
    # ~1.3k-file lancedb dir + 7.5 min of waits, ADR-0033). Single writer, so it stays generous.
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scrape-plan.outputs.run == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.scrape-plan.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: needs.scrape-plan.outputs.run == 'true'
        run: pip install -e ".[embed]" "huggingface_hub[cli]"
      - name: Download the prior store + LanceDB (empty on first run)
        if: needs.scrape-plan.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m headstart.ingest.state_fetch 'data/embeddings/jobs/*' 'data/lancedb/*'
      - name: Download corpus + refreshed state
        # continue-on-error: `join` is the one un-bankable stage, so if it timed out this artifact
        # is missing. Proceeding degrades to a safe no-op rather than a hard failure — with no
        # corpus, `plan_sync` sees an empty fresh-id set *and* an empty scraped-Board set, so it
        # adds and evicts nothing (verified), while prune/compact still run and the store is
        # re-uploaded unchanged. The scrape work is lost either way; failing here would lose the
        # dead-Board sweep too.
        if: needs.scrape-plan.outputs.run == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-state
          path: data
      - name: Download all embed fragments
        # continue-on-error: merge must still run if every embed shard failed. It then adds no new
        # vectors but the scrape's evictions, the priority ledger, and prune/compact still land —
        # losing a run's scrape work to a missing embed artifact would be the worst outcome.
        if: needs.scrape-plan.outputs.run == 'true' && needs.join.outputs.count != '0'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: embed-fragment-*
          path: data/embeddings/fragments
      - name: Merge shard fragments into the store
        if: needs.scrape-plan.outputs.run == 'true'
        # `--evict-ids` drops the stale row of any Job being re-embedded with a description it
        # previously lacked, before the new vector is appended (ADR-0050). It has to happen here
        # rather than after: this merge appends without deduping by id, so a later eviction would
        # take out the vector it had just written. `index sync` then replaces the table row and
        # carries its `first_seen` across.
        run: python -m headstart.ingest.embed_merge
      - name: Sync the jobs table
        if: needs.scrape-plan.outputs.run == 'true'
        run: python -m headstart.ingest.index sync
      - name: Prune dead-Board and duplicate rows
        if: needs.scrape-plan.outputs.run == 'true'
        run: python -m headstart.ingest.index prune --apply
      - name: Append role-trend counts (ADR-0040)
        # Never fatal: the module itself no-ops with a warning when the centroid store hasn't
        # reached this runner (fit not shipped yet, or the join's state artifact was lost) —
        # trends must not sink a run that already scraped and embedded successfully.
        if: needs.scrape-plan.outputs.run == 'true'
        continue-on-error: true
        run: python -m headstart.ingest.role_trends
      # No compaction here — it moved to the every-2-days `cleanup-index` run. `index compact`
      # rebuilds the table into ONE new .lance file, so every run minted a brand-new ~755 MB blob
      # that HF stores in full and keeps forever; at ~1.9 GB/run the 100 GB quota filled in ~45
      # runs. Lance appends instead: `sync`/`prune` write small new fragments and leave the big
      # existing file untouched, so a run now uploads a fraction of the table. Measured on a
      # 20k-row 61.6 MB table: 5 appends + a delete added 5 files totalling 6.17 MB (~10%).
      - name: Upload index state
        if: needs.scrape-plan.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Retry each upload — the HF API 504s intermittently on create/commit and a bare failure
          # sinks the whole run (e.g. 2026-07-16). Backs off 30s/60s before giving up.
          up() {
            for attempt in 1 2 3; do
              hf upload "$@" && return 0
              echo "::warning::hf upload attempt $attempt failed; retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            done
            return 1
          }
          up "$HF_DATASET" data/embeddings/jobs data/embeddings/jobs \
            --repo-type dataset --commit-message "nightly: embedding store"
          # Deliberately NOT --delete: nothing compacts here any more, so no local fragment is
          # superseded and every remote one is still live data. Passing --delete would make this a
          # full-table replace again — the exact cost this change removes. The every-2-days
          # `cleanup-index` run compacts and re-uploads *with* --delete, which is where superseded
          # fragments get reaped.
          up "$HF_DATASET" data/lancedb data/lancedb \
            --repo-type dataset --commit-message "nightly: lancedb index"
          up "$HF_DATASET" data/state data/state \
            --repo-type dataset --commit-message "nightly: board priority"
          # Append-only (ADR-0050): each run adds small per-ATS fragments and leaves the base
          # files alone, so this uploads ~430 KB rather than re-minting the ~174 MB store.
          # `cleanup-index` folds the fragments into the bases with --delete.
          up "$HF_DATASET" data/descriptions data/descriptions \
            --repo-type dataset --commit-message "nightly: description store"
      - name: Restart the Space to pick up the new index
        if: needs.scrape-plan.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).restart_space(os.environ['HF_SPACE'])
          print('space restarted')
          "

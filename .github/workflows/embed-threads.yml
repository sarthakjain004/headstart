name: embed-threads

# Does using the SMT siblings help? The embed shards run on `ubuntu-latest`, which advertises
# 4 vCPUs but is 2 physical cores + hyperthreading, so torch defaults to 2 intra-op threads.
# ADR-0029 left this untested and it cuts both ways: big matrix maths usually gains nothing from
# SMT (both threads queue for the same arithmetic units), but we measure only ~1/3 of the chip's
# peak, which means the core IS stalling somewhere — and stalls are exactly what SMT fills.
#
# Method notes, because a sloppy thread benchmark measures noise:
#   - One PROCESS per thread count. `OMP_NUM_THREADS` is read by OpenMP at startup, so setting it
#     mid-process (torch.set_num_threads alone) does not fully take effect. We set both.
#   - All variants run in ONE job, i.e. the same physical machine. A matrix would put each on a
#     different runner and confound the comparison with hardware variance.
#   - Repeats are INTERLEAVED (1,2,4,1,2,4), not grouped (1,1,2,2,4,4), so a machine that slows
#     down partway through shows up as within-variant spread instead of a fake winner.
#   - Same --seed, so every variant encodes byte-identical Docs.
on:
  workflow_dispatch:
    inputs:
      threads:
        description: comma-separated thread counts to compare (0 = torch's default)
        default: "1,2,4"
      docs:
        description: synthetic Docs per pass (fewer than embed-bench — this runs many passes)
        default: "80"
      repeats:
        description: interleaved passes over the whole sweep
        default: "3"
  # This branch is experimental and will not be merged, so workflow_dispatch can never reach it
  # (GitHub only registers dispatchable workflows from the default branch). A branch-scoped push
  # trigger is the only way to run it. Delete this block if the workflow is ever merged.
  push:
    branches: [perf/embed-thread-sweep]
    paths:
      - ".github/workflows/embed-threads.yml"
      - "scripts/bench/**"

permissions:
  contents: read

jobs:
  threads:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Only the production stack — no optimum/openvino here. Those cap transformers at <4.58
      # (ADR-0029), and this experiment must measure the versions production actually runs.
      - run: pip install -e ".[embed]"
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-model-nomic-embed-text-v1.5 # same key as the embed shards
      - name: Runner CPU (what the numbers are measured on)
        run: |
          echo "nproc=$(nproc)"
          lscpu | grep -iE "model name|^CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket" || true
      - name: Thread sweep
        run: |
          # NB: on a push event `github.event.inputs.*` is empty, so the `||` defaults below are
          # load-bearing here (unlike embed-bench.yml, where dispatch always supplies them).
          out="embed-threads_${{ github.run_id }}_ubuntu-latest.txt"
          echo "OUT=$out" >> "$GITHUB_ENV"
          for pass in $(seq 1 "${{ github.event.inputs.repeats || '3' }}"); do
            for t in $(echo "${{ github.event.inputs.threads || '1,2,4' }}" | tr ',' ' '); do
              echo "::group::pass $pass — threads=$t"
              if [ "$t" = "0" ]; then unset OMP_NUM_THREADS; extra=""; else
                export OMP_NUM_THREADS="$t"; extra="--threads $t"; fi
              echo "=== pass=$pass threads=$t ==="
              python scripts/bench/embed_backends.py \
                --docs "${{ github.event.inputs.docs || '80' }}" \
                --backends torch-fp32 $extra
              echo "::endgroup::"
            done
          done 2>&1 | tee "$out"
      - name: Summarise (median tok/s per thread count)
        if: always()
        run: python scripts/bench/summarize_threads.py "$OUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: embed-threads-results
          path: ${{ env.OUT }}
          retention-days: 30

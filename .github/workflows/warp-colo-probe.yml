# Diagnostic only — never scheduled. Delete once an egress strategy is settled.
#
# Two earlier probes established that the spare egress does not deliver IP diversity: 30 runners
# with 30 distinct direct IPs collapsed onto 11 WARP IPs (one shared by 8 jobs), and neither
# `systemctl restart` (47% fresh) nor `registration delete`+`new` (31% fresh) escapes the pool.
#
# The open question is *why the pool is small*, and the plausible answer is that WARP always lands
# on the Cloudflare colo nearest the runner — and every runner in a job sits in one Azure region.
# If so, the lever is the colo, not the rotation verb.
#
# `warp-cli tunnel endpoint set <IP:PORT>` forces a specific Cloudflare endpoint. WARP's endpoints
# are anycast, so forcing one may still route to the nearest PoP — that is exactly what this
# measures. `colo` comes from Cloudflare's own trace endpoint, so it is Cloudflare's answer to
# "which datacentre served you", not an inference from the IP.
#
# Third arm: `tunnel rotate-keys` (new key-pair, same registration) — the one rotation verb not
# yet measured.
name: warp-colo-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  colo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
        method: [restart, rotate-keys, endpoint]
    steps:
      - name: Install WARP without the GUI dependency stack
        run: |
          set -x
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq equivs >/dev/null
          cd /tmp
          for p in libwebkit2gtk-4.1-0 libayatana-appindicator3-1; do
            printf 'Section: misc\nPriority: optional\nStandards-Version: 3.9.2\nPackage: %s-headless-stub\nProvides: %s\nDescription: stub\n stub\n' "$p" "$p" > "$p.ctl"
            equivs-build "$p.ctl" >/dev/null
          done
          sudo dpkg -i /tmp/*headless-stub*.deb >/dev/null
          cd -
          curl -fsSL --max-time 15 --retry 1 --retry-delay 2 https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo timeout 45 apt-get update -qq \
            -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=2 \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/cloudflare-client.list \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 || true
          sudo timeout 90 apt-get install -y -qq \
            -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=2 cloudflare-warp

      - name: Where is this runner, and where does WARP put us
        run: |
          set -x
          # The runner's own position, so a colo difference can be attributed to region or not.
          curl -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^\(ip\|loc\|colo\)=/DIRECT_\1=/p' || true

          dial() {
            timeout 30 warp-cli --accept-tos mode proxy || true
            timeout 30 warp-cli --accept-tos proxy port 40000 || true
            timeout 30 warp-cli --accept-tos connect || true
            for _ in $(seq 1 20); do timeout 2 bash -c '</dev/tcp/127.0.0.1/40000' 2>/dev/null && break; sleep 1; done
          }
          # Cloudflare's own answer to "which datacentre served this request", through the tunnel.
          probe() {
            curl -fsS --max-time 20 --proxy socks5://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null \
              | sed -n 's/^\(ip\|colo\|loc\)=/\1=/p' | tr '\n' ' '
          }

          sudo timeout 15 systemctl start warp-svc || true
          for _ in $(seq 1 15); do timeout 5 warp-cli --accept-tos status >/dev/null 2>&1 && break; sleep 1; done
          timeout 30 warp-cli --accept-tos registration new || true
          dial
          echo "COLO n=0 method=${{ matrix.method }} $(probe)"

          # Anycast endpoints across two of Cloudflare's WARP prefixes and two ports. If anycast
          # pins us to the nearest PoP regardless, every one of these reports the same colo — which
          # is the result that would kill this approach.
          ENDPOINTS="162.159.192.1:2408 162.159.193.10:2408 188.114.96.1:2408 162.159.195.1:500 188.114.97.1:4500"
          n=0
          for ep in $ENDPOINTS; do
            n=$(( n + 1 ))
            case "${{ matrix.method }}" in
              restart)
                sudo timeout 30 systemctl restart warp-svc || true
                sleep 3
                for _ in $(seq 1 15); do timeout 5 warp-cli --accept-tos status >/dev/null 2>&1 && break; sleep 1; done
                ;;
              rotate-keys)
                timeout 30 warp-cli --accept-tos tunnel rotate-keys || true
                ;;
              endpoint)
                sudo timeout 30 warp-cli --accept-tos tunnel endpoint set "$ep" || echo "endpoint set REFUSED for $ep"
                sudo timeout 30 systemctl restart warp-svc || true
                sleep 3
                for _ in $(seq 1 15); do timeout 5 warp-cli --accept-tos status >/dev/null 2>&1 && break; sleep 1; done
                ;;
            esac
            dial
            echo "COLO n=$n method=${{ matrix.method }} ep=$ep $(probe)"
          done
          sudo timeout 30 warp-cli --accept-tos tunnel endpoint reset || true

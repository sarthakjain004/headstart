name: ci

# PR quality gate: lint, format-check, and tests. Cheap checks first so a
# failure surfaces fast. Mark the `quality` job as a required status check in a
# branch ruleset on `main` to actually block merges on red.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read              # least-privilege default token

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true    # drop superseded runs on rapid pushes

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # default is 360; cap it
    steps:
      # Actions pinned to full commit SHAs (tags are mutable — cf. tj-actions
      # CVE-2025-30066). Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest
      # The UI is a plain browser script with no build step, so its tests run on the built-in
      # Node runner — no package.json, no node_modules, no second package manager. The version
      # is pinned like python-version above for the same reason: the runner image's Node moves
      # under us otherwise, and `node --test` has changed behaviour across releases.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # failglob so a glob matching nothing FAILS. Without it bash passes the literal pattern
      # through, node matches no files, and the step exits 0 reporting `tests 0` — deleting or
      # moving the suite would leave CI green with nothing running.
      - name: UI tests (node)
        run: |
          shopt -s failglob
          node --test tests/js/*.test.js

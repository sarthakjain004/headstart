<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HeadStart — jobs straight from the source</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --accent: #4f46e5; --pill: #eef2ff; --pill-ink: #4338ca;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 28px 20px 18px; max-width: 1000px; margin: 0 auto;
  }
  h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-top: 4px; font-size: 13px; }
  .bar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 12px 20px;
  }
  .bar .inner {
    max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  input[type="text"], select {
    font: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink);
  }
  input[type="text"] { flex: 1 1 220px; min-width: 160px; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px 20px 60px; }
  .stats { color: var(--muted); font-size: 13px; margin: 6px 2px 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .card .title { font-size: 16px; font-weight: 650; color: var(--ink); text-decoration: none; }
  .card .title:hover { color: var(--accent); text-decoration: underline; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .pills { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-size: 12px; padding: 2px 9px; border-radius: 999px;
    background: var(--pill); color: var(--pill-ink); white-space: nowrap;
  }
  .pill.remote { background: #ecfdf5; color: #047857; }
  .pill.ats { background: #f3f4f6; color: #374151; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Head<span>Start</span></h1>
  <div class="sub">Software roles pulled straight from company ATS boards —
    <span id="total">…</span> openings, refreshed <span id="gen">…</span>.</div>
</header>

<div class="bar"><div class="inner">
  <input type="text" id="q" placeholder="Search title, company, department…" autocomplete="off" />
  <input type="text" id="loc" placeholder="Location…" autocomplete="off" />
  <select id="company"><option value="">All companies</option></select>
  <select id="ats">
    <option value="">All sources</option>
    <option value="greenhouse">Greenhouse</option>
    <option value="lever">Lever</option>
    <option value="ashby">Ashby</option>
  </select>
  <select id="sort">
    <option value="company">Sort: Company</option>
    <option value="recent">Sort: Recently posted</option>
  </select>
  <label class="chk"><input type="checkbox" id="remote" /> Remote only</label>
</div></div>

<main>
  <div class="stats" id="stats"></div>
  <div id="results"></div>
</main>

<script>
const CAP = 400;
let ALL = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function init() {
  try {
    const feed = await (await fetch("./jobs.json")).json();
    ALL = feed.jobs || [];
    $("total").textContent = feed.count ?? ALL.length;
    $("gen").textContent = feed.generated_at
      ? new Date(feed.generated_at).toLocaleString() : "—";
    for (const c of [...new Set(ALL.map((j) => j.company))].sort()) {
      const o = document.createElement("option");
      o.value = o.textContent = c;
      $("company").appendChild(o);
    }
  } catch (e) {
    $("results").innerHTML = '<div class="empty">Could not load jobs.json.</div>';
    return;
  }
  ["q", "loc", "company", "ats", "sort", "remote"].forEach((id) =>
    $(id).addEventListener("input", render));
  render();
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const loc = $("loc").value.trim().toLowerCase();
  const company = $("company").value;
  const ats = $("ats").value;
  const remoteOnly = $("remote").checked;

  let rows = ALL.filter((j) => {
    if (company && j.company !== company) return false;
    if (ats && j.ats !== ats) return false;
    if (remoteOnly && j.remote !== true) return false;
    if (loc && !(j.location || "").toLowerCase().includes(loc)) return false;
    if (q) {
      const hay = `${j.title} ${j.company} ${j.department || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if ($("sort").value === "recent") {
    rows.sort((a, b) => (b.posted_at || "").localeCompare(a.posted_at || ""));
  } else {
    rows.sort((a, b) =>
      a.company.localeCompare(b.company) || a.title.localeCompare(b.title));
  }

  const shown = rows.slice(0, CAP);
  $("stats").textContent = rows.length > CAP
    ? `Showing first ${CAP} of ${rows.length} matching roles`
    : `${rows.length} matching role${rows.length === 1 ? "" : "s"}`;

  if (!rows.length) {
    $("results").innerHTML = '<div class="empty">No roles match these filters.</div>';
    return;
  }

  $("results").innerHTML = shown.map((j) => {
    const pills = [`<span class="pill ats">${esc(j.ats)}</span>`];
    if (j.remote === true) pills.push('<span class="pill remote">Remote</span>');
    if (j.department) pills.push(`<span class="pill">${esc(j.department)}</span>`);
    const meta = [esc(j.company), esc(j.location || "Location n/a")].join(" · ");
    return `<article class="card">
      <a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      <div class="meta">${meta}</div>
      <div class="pills">${pills.join("")}</div>
    </article>`;
  }).join("");
}

init();
</script>
</body>
</html>

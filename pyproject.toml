[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "headstart"
version = "0.0.0"
description = "Find software-engineering openings straight from company ATS boards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/headstart"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

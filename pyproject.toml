[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "headstart"
version = "0.0.0"
description = "Find software-engineering openings straight from company ATS boards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["curl_cffi>=0.7"]  # Darwinbox is behind Cloudflare TLS fingerprinting

[project.optional-dependencies]
# ruff is version-pinned: its formatter output can shift between releases, so an
# unpinned CI would reformat differently than local and fail `ruff format --check`.
# Dependabot bumps this; bump commits carry any reformat with them.
# flask/xlsxwriter/openpyxl are here, not just in their own extras, so the tests that need
# them actually RUN in CI rather than silently importorskip-ing: the Space's filter builder
# and the Digest spreadsheet are otherwise covered nowhere automatic (ADR-0035). All three
# are small and pure-Python — this does not pull the ML stack into the quality job.
dev = ["pytest", "ruff==0.16.2", "flask", "xlsxwriter", "openpyxl"]
# The scrape fan-out's browser escalation (ADR-0056): darwinbox's Cloudflare wall admits a real
# Chrome and nothing else, so the shards need pydoll. Imported lazily (browser_http) — only a
# board that actually hits the wall starts a browser; the quality job never installs this.
scrape = ["pydoll-python"]
# Semantic-search stack (ADR-0005). nomic-embed-text-v1.5 runs on this; einops is
# required by nomic's custom modeling code; langdetect gates the English-only corpus.
# scikit-learn arrives transitively via sentence-transformers; named because
# scripts/embed/cluster_roles.py imports it directly (ADR-0040).
embed = ["sentence-transformers>=3.0", "einops", "langdetect", "lancedb", "scikit-learn"]
# Local dev UI for the semantic search (scripts/ui/serve.py)
ui = ["flask"]
# Retrieval-eval harness (scripts/eval/). anthropic = the LLM-judge that grades the
# pool; ranx = graded ranking metrics (nDCG@10) for the defensible score; scikit-learn
# = Cohen's kappa validating the judge (arrives transitively via embed, named for clarity).
eval = ["anthropic", "ranx", "scikit-learn"]
# Email alerts (ADR-0035). google-auth verifies the Google sign-in credential (hand-rolling
# the JWT checks is how you turn a signed assertion into a free-text field); xlsxwriter
# builds the Digest's spreadsheet; huggingface_hub reads and writes the Subscription records.
alerts = ["google-auth", "xlsxwriter", "huggingface_hub"]

[tool.hatch.build.targets.wheel]
packages = ["src/headstart"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

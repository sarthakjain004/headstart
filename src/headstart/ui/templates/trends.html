<section class="trends" id="trends">
  <div class="trends-head">
    <h2>Which tech roles are growing</h2>
    <span class="note" id="trends-scope"></span>
    <span class="trends-toggles">
      <span class="seg" id="trends-metric" role="group" aria-label="Measure">
        <button data-metric="stock" aria-pressed="true">All openings</button>
        <button data-metric="new" aria-pressed="false">New this week</button>
      </span>
      <span class="seg" id="trends-unit" role="group" aria-label="Unit">
        <button data-unit="share" aria-pressed="true">Share</button>
        <button data-unit="count" aria-pressed="false">Count</button>
      </span>
      <span class="seg" id="trends-split" role="group" aria-label="Drill" hidden>
        <button data-split="bands" aria-pressed="true">By level</button>
        <button data-split="roles" aria-pressed="false">By role</button>
      </span>
      <span class="ats-pick" id="trends-ats">
        <button class="ghost" id="trends-ats-trigger" type="button"
                aria-haspopup="true" aria-expanded="false">All ATS ▾</button>
        <div class="ats-pick-menu" id="trends-ats-menu" hidden>
          {% for a in atses %}<label><input type="checkbox" value="{{ a }}" checked> {{ a }}</label>{% endfor %}
        </div>
      </span>
    </span>
  </div>
  <div class="trends-range">
    <label class="note" for="trends-since">Window</label>
    <input type="datetime-local" id="trends-since" aria-label="From">
    <span class="note">–</span>
    <input type="datetime-local" id="trends-until" aria-label="To">
    <button class="ghost" id="trends-range-clear">Clear</button>
  </div>
  <div class="trends-note" id="trends-empty"></div>
  <div class="trends-grid">
    <svg id="trends-chart" viewBox="0 0 720 260" preserveAspectRatio="none"
         role="img" aria-label="Open roles over time by category"></svg>
    <ul class="trends-legend" id="trends-legend"></ul>
  </div>
  <div class="note" id="trends-foot"></div>
</section>

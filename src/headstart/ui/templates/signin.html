<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeadStart — sign in</title>
<style>
  /* A subset of style.css's tokens — just enough for one card. Deliberately self-contained:
     signed-out requests can't fetch /static (the wall gates it), so the door inlines all it needs. */
  :root{
    --ground:#0E1220; --raise:#161B2C; --rule:#252C42; --ink:#EEF1F8; --ink-2:#A8B0C6;
    --ink-3:#6F7896; --aqua:#12D6B4; --violet:#8B5CF6; --glow:rgba(18,214,180,.22);
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:ui-serif,"Iowan Old Style",Georgia,serif;
  }
  @media (prefers-color-scheme: light){
    :root{ --ground:#F6F7FB; --raise:#FFFFFF; --rule:#E2E6F0; --ink:#131726; --ink-2:#4C5570;
      --ink-3:#7A83A0; --aqua:#00806B; --violet:#5B34D6; --glow:rgba(0,128,107,.16); }
  }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  /* a `display` rule outranks the hidden attribute, and both .openout and .g set one —
     without this the escape hatch shows on the normal door and the dead button stays put */
  [hidden]{ display:none !important; }
  body{ background:var(--ground); color:var(--ink); font:15px/1.55 var(--sans);
    display:grid; place-items:center; }
  .door{ background:var(--raise); border:1px solid var(--rule); border-radius:20px;
    padding:38px 40px; max-width:400px; margin:20px; text-align:center; }
  .mark{ width:34px; height:34px; border-radius:10px; margin:0 auto 14px; position:relative;
    background:linear-gradient(135deg,var(--aqua),var(--violet));
    box-shadow:0 0 0 1px rgba(255,255,255,.10) inset, 0 8px 20px var(--glow); }
  .mark::after{ content:""; position:absolute; inset:10px 10px auto auto; width:8px; height:8px;
    border-radius:50%; background:var(--ground); }
  h1{ font:600 22px/1.2 var(--serif); margin:0 0 6px; }
  h1 em{ font-style:normal; background:linear-gradient(100deg,var(--aqua),var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  p{ color:var(--ink-2); font-size:13.5px; margin:0 0 22px; }
  .g{ display:flex; justify-content:center; }
  .note{ color:var(--ink-3); font-size:12.5px; margin-top:16px; min-height:1em; }
  .openout{ display:inline-block; text-decoration:none; font:600 14px var(--sans);
    color:#04121A; padding:13px 24px; border-radius:12px;
    background:linear-gradient(120deg,var(--aqua),var(--violet));
    box-shadow:0 8px 22px var(--glow); }
</style></head><body>
<div class="door">
  <div class="mark"></div>
  <h1>Head<em>Start</em></h1>
  <p>Tech jobs read straight from company career boards, matched on meaning.
     Sign in to search.</p>
  <div class="g" id="gbtn"></div>
  <a class="openout" id="openout" hidden target="_blank" rel="noopener">Open HeadStart to sign in ↗</a>
  <div class="note" id="msg" role="status"></div>
</div>
<script>
// Embedded in another site's page — huggingface.co/spaces/… frames this app — the door
// cannot work in place, for two independent reasons, so it offers the way out instead.
// 1. Google's sign-in needs the `identity-credentials-get` permission from the embedding
//    page; HF's iframe doesn't grant it, so the flow hangs part-way through Google.
// 2. The session cookie is SameSite=Lax (ADR-0043 leans on that instead of CSRF tokens),
//    and Lax cookies are never sent from inside another site's frame — so even a
//    successful sign-in would land back here, signed out, forever.
// `location.href` is already the direct Space URL (it IS the iframe's src), so nothing
// needs hardcoding; HF's sandbox allows popups, so the new tab opens.
const EMBEDDED = window.top !== window.self;

function offerNewTab(){
  const out = document.getElementById('openout');
  out.href = location.href;
  out.hidden = false;
  document.getElementById('gbtn').hidden = true;
  document.getElementById('msg').textContent =
    'Sign-in needs its own tab — this page is embedded inside Hugging Face.';
}

async function onCred(resp){
  const msg = document.getElementById('msg');
  try{
    const r = await fetch('/auth/google', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ credential: resp.credential }) });
    if (r.ok){ location.reload(); return; }
    const d = await r.json().catch(() => ({}));
    msg.textContent = d.error || ('Sign-in failed (' + r.status + ')');
  }catch(e){ msg.textContent = 'That request didn\'t go through. Try again.'; }
}
function initSignin(){
  // Never render Google's button in a frame: it looks clickable and then stalls.
  if (EMBEDDED || !window.google) return;
  google.accounts.id.initialize({ client_id: {{ google_client_id|tojson }}, callback:onCred });
  google.accounts.id.renderButton(document.getElementById('gbtn'),
    { theme:'outline', size:'large' });
}
if (EMBEDDED) offerNewTab();   // before Google's script loads — the door is usable at once
</script>
<script src="https://accounts.google.com/gsi/client" async onload="initSignin()"></script>
</body></html>

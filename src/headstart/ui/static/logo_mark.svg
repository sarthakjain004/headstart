<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="HeadStart">
  <!-- The HeadStart mark: a start line and an arrow already leaving it. One fixed brand
       colour rather than a theme token, so the same file serves as the favicon and reads on
       both grounds: white on #4F46E5 is 6.3:1, and the tile is 3.1:1 against the dark
       ground and 5.2:1 against the light one. -->
  <rect width="32" height="32" rx="9" fill="#4F46E5"/>
  <path d="M10 9v14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 16h12.5M17.5 10.5 23 16l-5.5 5.5" fill="none" stroke="#FFFFFF" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
